---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: vaulticcertificates.vaultic.dev
spec:
  group: vaultic.dev
  names:
    kind: VaulticCertificate
    listKind: VaulticCertificateList
    plural: vaulticcertificates
    singular: vaulticcertificate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workspace
      name: Workspace
      type: string
    - jsonPath: .spec.application
      name: Application
      type: string
    - jsonPath: .spec.commonName
      name: Common Name
      type: string
    - jsonPath: .status.version
      name: Version
      type: integer
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: VaulticCertificate materializes one Vaultic certificate as a
          Kubernetes TLS Secret.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VaulticCertificateSpec describes which Vaultic certificate
              to sync and where to materialize it.
            properties:
              application:
                description: |-
                  Application slug. Certificate Manager's Application is workspace-scoped, not nested
                  under a Secrets Manager Project/Environment — see docs/certificate-manager-plan.md's
                  "Cert scoping" addendum.
                minLength: 1
                type: string
              commonName:
                description: CommonName identifies the Vaultic certificate to fetch
                  from the application.
                minLength: 1
                type: string
              refreshIntervalSeconds:
                default: 60
                description: RefreshIntervalSeconds controls how often the controller
                  re-polls Vaultic. Defaults to 60.
                format: int32
                minimum: 5
                type: integer
              serverURL:
                description: ServerURL is the Vaultic API base URL, e.g. "https://vaultic.example.com".
                pattern: ^https?://\S+$
                type: string
              targetSecretName:
                description: TargetSecretName is the native TLS Secret this controller
                  creates/updates. Defaults to the CR name.
                type: string
              tokenSecretRef:
                description: TokenSecretRef points at the Kubernetes Secret holding
                  a Vaultic service token.
                properties:
                  key:
                    default: token
                    description: Key within that Secret's data. Defaults to "token".
                    type: string
                  name:
                    description: Name of the Secret in the same namespace as the VaulticSecret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              workspace:
                description: Workspace slug.
                minLength: 1
                type: string
            required:
            - application
            - commonName
            - serverURL
            - tokenSecretRef
            - workspace
            type: object
          status:
            description: VaulticCertificateStatus reports the outcome of the most
              recent sync.
            properties:
              conditions:
                description: Conditions follow the standard Kubernetes condition convention.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is when the target Secret was last successfully
                  refreshed.
                format: date-time
                type: string
              version:
                description: Version is the Vaultic certificate version written at
                  last sync.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
