# 1. A Kubernetes Secret holding a Vaultic service token (create one with
#    `vaultic tokens create k8s-operator --read-only`), referenced by name below — never put the
#    token directly in the VaulticSecret spec.
apiVersion: v1
kind: Secret
metadata:
  name: vaultic-token
  namespace: default
type: Opaque
stringData:
  token: "REPLACE_WITH_A_REAL_VAULTIC_SERVICE_TOKEN"
---
# 2. The VaulticSecret custom resource: sync acme/backend-api's "production" environment into
#    a native Secret named "backend-api-production" in this namespace, refreshed every 60s.
apiVersion: vaultic.dev/v1
kind: VaulticSecret
metadata:
  name: backend-api-production
  namespace: default
spec:
  serverURL: http://vaultic-server.default.svc.cluster.local:4000
  workspace: acme
  project: backend-api
  environment: production
  tokenSecretRef:
    name: vaultic-token
    key: token
  targetSecretName: backend-api-production
  refreshIntervalSeconds: 60
